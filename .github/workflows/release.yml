name: Release

# v로 시작하는 태그를 올리면(예: v0.1.0) 서명한 입력기를 빌드해 GitHub Releases에 올린다.
# 하이픈이 들어간 태그(v0.1.0-beta.1)는 시험판(prerelease)으로 올린다.
#
# 필요한 저장소 비밀값 (scripts/setup-release-signing.sh 참고)
#   SEMOE_SIGNING_P12           릴리스 서명 인증서(.p12)의 base64
#   SEMOE_SIGNING_P12_PASSWORD  .p12 암호

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 원본 커밋 읽기
        id: source
        run: echo "commit=$(jq -r .source.commit data/meta.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Sinseiki/Semo-e_keyboard
          ref: ${{ steps.source.outputs.commit }}
          path: Semo-e_keyboard

      - name: Rust 설치
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen

      - name: 테스트와 생성물 확인
        run: |
          cargo test
          SEMOE_SOURCE=Semo-e_keyboard scripts/gen-data.sh --check

      - name: 서명 인증서를 임시 키체인에 넣기
        env:
          P12: ${{ secrets.SEMOE_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.SEMOE_SIGNING_P12_PASSWORD }}
        run: scripts/ci-import-signing.sh

      # SIGN_KEYCHAIN, SIGN_IDENTITY(인증서 SHA-1)는 앞 단계가 정한다.
      - name: 빌드와 서명
        run: |
          version="${GITHUB_REF_NAME#v}"
          CHECK_HEADER=1 SEMOE_VERSION="$version" SEMOE_BUILD="$GITHUB_RUN_NUMBER" scripts/build-macos.sh
          lipo -info build/SemoeIME.app/Contents/MacOS/SemoeIME | grep -q 'x86_64 arm64'
          test -f build/SemoeIME.app/Contents/Resources/LICENSE.txt
          test -f build/SemoeIME.app/Contents/Resources/DATA-NOTICE.md

      # install.sh가 받은 앱을 확인할 때 쓰는 인증서 해시와 실제 서명이 같아야 한다.
      - name: 서명 인증서 확인
        run: |
          expected=$(sed -n 's/^EXPECTED_CERT_SHA1=//p' install.sh)
          actual=$(codesign -dr - build/SemoeIME.app 2>&1 | sed -n 's/.*certificate leaf = H"\([0-9a-f]*\)".*/\1/p')
          echo "expected=$expected actual=$actual"
          [[ -n "$expected" && "$expected" == "$actual" ]]

      - name: 묶기
        run: |
          cd build
          ditto -c -k --keepParent SemoeIME.app SemoeIME.zip
          shasum -a 256 SemoeIME.zip > SemoeIME.zip.sha256
          cat SemoeIME.zip.sha256

      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" build/SemoeIME.zip build/SemoeIME.zip.sha256 \
            --title "세모이 $GITHUB_REF_NAME" --generate-notes "${flags[@]}"

      - name: 임시 키체인 지우기
        if: always()
        run: '[[ -z "${SIGN_KEYCHAIN:-}" ]] || security delete-keychain "$SIGN_KEYCHAIN"'
